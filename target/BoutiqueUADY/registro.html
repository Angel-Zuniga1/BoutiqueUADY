<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Boutique UADY</title>
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
<header class="barra">
  <!-- El inicio es index.html -->
  <a class="marca" href="index.html">Boutique <b>UADY</b></a>
  <nav>
    <a href="catalogo.html">Catálogo</a>
    <a href="login.html">Iniciar sesión</a>
    <a class="boton" href="registro.html">Crear cuenta</a>
  </nav>
</header>
<main>
<section class="formulario">
  <h1>Crear cuenta</h1>
  
  <!-- Aquí se muestran los mensajes de error o éxito -->
  <div id="mensaje"></div>

  <!-- Los avisos de campos vacios los muestra validacion.js con alert -->
  <form action="api/registro" method="post" id="formulario" data-accion="registro" novalidate>
    <label>Nombre <input name="nombre"></label>
    <label>Apellidos <input name="apellidos"></label>
    <label>Correo <input type="email" name="correo"></label>
    <label>Teléfono (opcional) <input name="telefono"></label>
    <label>Contraseña <input type="password" name="password"></label>
    <label>Repite la contraseña <input type="password" name="password2"></label>
    <button class="boton grande" type="submit">Crear cuenta</button>
  </form>
  <p class="aparte">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</section>
</main>
<footer class="pie">
  Boutique UADY en línea · Proyecto integrador de Desarrollo de Aplicaciones Web · Facultad de Matemáticas
</footer>
  <script src="assets/js/validacion.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
