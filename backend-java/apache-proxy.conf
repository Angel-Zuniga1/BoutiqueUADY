# Boutique UADY - reenvío de /BoutiqueUADY/api hacia Tomcat (misma "dirección" para el navegador)
# Pegar al FINAL de C:\xampp\apache\conf\httpd.conf  (o incluirlo con: Include "ruta/a/apache-proxy.conf")
<IfModule proxy_module>
<IfModule proxy_http_module>
    ProxyPreserveHost On
    ProxyPass        /BoutiqueUADY/api http://127.0.0.1:8080/BoutiqueUADY/api
    ProxyPassReverse /BoutiqueUADY/api http://127.0.0.1:8080/BoutiqueUADY/api
</IfModule>
</IfModule>
